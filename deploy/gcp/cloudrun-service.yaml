apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: genesis-cognitive-mainframe
  labels:
    cloud.googleapis.com/location: asia-northeast1
    app: genesis-cybernetics
    tier: production
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/genesis-cybernetics/genesis-cognitive-mainframe:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "genesis-cybernetics-prod"
        - name: GCP_REGION
          value: "asia-northeast1"
        - name: VERTEX_AI_MODEL
          value: "gemini-2.5-flash"
        - name: CPG_FREQ_HZ
          value: "1000"
        - name: SPINAL_REFLEX_LATENCY_MS
          value: "5"
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 15
