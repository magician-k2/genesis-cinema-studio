# ================================================================================
# GENESIS Gemma 4 Developer Agent Specification (agent.yaml)
# Google - Gemma 4 Developer Agent Competition (Kaggle)
# Compliant with Google Agent Development Kit (ADK) & swegemma Harness
# ================================================================================

agent:
  name: "genesis-gemma4-developer-agent"
  version: "1.0.0"
  description: "Autonomous Agentic Software Engineering Agent powered by Reverse-Mindmap Causal Navigation & Triple-Shield Self-Healing"
  author: "Team GENESIS"

model:
  base_model: "google/gemma-4-31b-it"
  framework: "transformers"
  device: "cuda"
  torch_dtype: "bfloat16"

prompts:
  system_prompt_path: "prompts/system.md"

configs:
  sampling_config_path: "configs/sampling.yaml"

skills:
  - name: "reverse_mindmap_locator"
    entrypoint: "skills.reverse_mindmap_locator:locate_bug_root_cause"
    description: "Reverse-maps stack traces, error messages, and issue descriptions to pinpoint the exact buggy files and AST function nodes."
  
  - name: "lsp_syntax_auditor"
    entrypoint: "skills.lsp_syntax_auditor:audit_code_syntax"
    description: "Performs AST and LSP syntax verification to ensure zero syntax errors before patch generation."

  - name: "patch_generator"
    entrypoint: "skills.patch_generator:generate_git_patch"
    description: "Produces unified diff (git patch) with proper hunk headers for automated git apply validation."

  - name: "surgical_patch_synthesizer"
    entrypoint: "skills.surgical_patch_synthesizer:synthesize_patch"
    description: "Performs AST-guided surgical code splicing and unified diff generation with guaranteed indentation safety."

metadata:
  zero_dependency_offline: true
  eu_ai_act_compliant: true
