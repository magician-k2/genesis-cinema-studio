# Sampling Parameters for Gemma 4 Code Generation & Bug Fixing
generation:
  temperature: 0.1
  top_p: 0.95
  top_k: 40
  max_new_tokens: 4096
  repetition_penalty: 1.05
  do_sample: true
  pad_token_id: 0
  eos_token_id: 1

decoding:
  strategy: "greedy_with_fallback"
  beam_size: 1

timeout:
  per_issue_seconds: 300
