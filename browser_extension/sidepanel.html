<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENESIS μTRON XAI SidePanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(0, 240, 255, 0.35);
      --accent-cyan: #00f0ff;
      --accent-emerald: #10b981;
      --accent-purple: #c084fc;
      --accent-crimson: #ef4444;
      --accent-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* 🌟 Header Ribbon */
    .side-header {
      height: 44px;
      background: #0d121f;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .brand span {
      color: var(--accent-cyan);
    }

    .live-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--accent-emerald);
      font-weight: 600;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      height: 28px;
      padding: 0 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      gap: 4px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .icon-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
    }

    /* 🗣️ Live Query Bar */
    .live-query-banner {
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      padding: 8px 12px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-shrink: 0;
    }

    .query-label {
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
    }

    .query-text {
      color: #38bdf8;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 🎨 Canvas Area (Scalable Flex) */
    .canvas-container {
      flex: 1;
      min-height: 120px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a1120 0%, #07090e 100%);
    }

    #sidepanel-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 🔍 Zoom Controls */
    .zoom-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 30;
    }

    .zoom-btn {
      width: 26px;
      height: 26px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.15s;
    }

    .zoom-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* 🎛️ Drag Resizer Splitter (上下可変バー) */
    .panel-splitter {
      height: 10px;
      background: #0f172a;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      cursor: row-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s;
      z-index: 35;
    }

    .panel-splitter:hover, .panel-splitter.dragging {
      background: rgba(0, 240, 255, 0.25);
      border-bottom-color: var(--accent-cyan);
    }

    .splitter-handle {
      width: 38px;
      height: 3px;
      border-radius: 2px;
      background: #475569;
      pointer-events: none;
      transition: background 0.2s;
    }

    .panel-splitter:hover .splitter-handle, .panel-splitter.dragging .splitter-handle {
      background: var(--accent-cyan);
    }

    /* 📜 Bottom Thinking Chronicle (可変高さ) */
    .chronicle-container {
      height: 220px; /* 初期高さ: 適度にログが見える設定 */
      min-height: 80px;
      max-height: 80vh;
      background: rgba(6, 9, 15, 0.98);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: height 0.05s ease-out;
    }

    .chronicle-header {
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .chronicle-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chronicle-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* プリセット切替ボタン */
    .preset-btn {
      font-size: 9px;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }

    .preset-btn:hover {
      color: #fff;
      border-color: var(--accent-cyan);
    }

    /* Google Docs 保存ボタン */
    .gdocs-btn {
      font-size: 10px;
      padding: 3px 8px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.3) 0%, rgba(0, 240, 255, 0.25) 100%);
      border: 1px solid rgba(0, 240, 255, 0.5);
      border-radius: 5px;
      color: #38bdf8;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .gdocs-btn:hover {
      background: linear-gradient(135deg, #2563eb 0%, #00f0ff 100%);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .chronicle-stream {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      line-height: 1.65;
      display: flex;
      flex-direction: column;
      gap: 4px;
      user-select: text; /* ログテキストは選択・コピー可能 */
    }

    .log-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
      margin-bottom: 4px;
    }

    .log-row:hover {
      background: rgba(15, 23, 42, 0.85);
      border-color: rgba(0, 240, 255, 0.25);
    }

    .log-row-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .log-row .time {
      color: #38bdf8;
      font-weight: 700;
      min-width: 56px;
      flex-shrink: 0;
    }

    .log-row.web { border-left: 3px solid #10b981; }
    .log-row.gemini { border-left: 3px solid #c084fc; }
    .log-row.local { border-left: 3px solid #38bdf8; }
    .log-row.prune { border-left: 3px solid #f472b6; }
    .log-row.core { border-left: 3px solid #fde047; background: rgba(234, 179, 8, 0.08); }

    .log-row.web .title { color: #6ee7b7; font-weight: 600; }
    .log-row.gemini .title { color: #e9d5ff; font-weight: 600; }
    .log-row.local .title { color: #7dd3fc; font-weight: 600; }
    .log-row.prune .title { color: #f472b6; font-weight: 600; }
    .log-row.core .title { color: #fde047; font-weight: 800; font-size: 11.5px; }

    .log-body {
      padding-left: 64px;
      font-size: 10px;
      color: #94a3b8;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-evidence-quote {
      background: rgba(0, 0, 0, 0.35);
      border-left: 2px solid rgba(0, 240, 255, 0.4);
      padding: 4px 8px;
      border-radius: 2px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
    }

    .log-mapping-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 3px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-weight: 700;
      font-size: 9px;
      width: fit-content;
    }

    /* 🔍 Slide-up Node Inspector */
    .inspector-drawer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 18, 31, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--accent-cyan);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 40;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 60%;
      overflow-y: auto;
    }

    .inspector-drawer.active {
      transform: translateY(0);
    }

    /* 📜 Evidence Receipt Modal */
    .receipt-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .receipt-backdrop.open {
      display: flex;
    }

    .receipt-card {
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      background: #0b1120;
      border: 1px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #94a3b8;
    }

    /* 🔔 Toast Notification */
    .toast-notice {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #064e3b;
      color: #34d399;
      border: 1px solid #10b981;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      z-index: 150;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast-notice.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- 🌟 Header Ribbon -->
  <div class="side-header">
    <div class="brand">
      <span>⚡</span> μTRON XAI
    </div>
    <div class="live-status">
      <div class="pulse-dot"></div>
      <span id="gemini-sync-status">Gemini 同期中</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openReceiptModal()" title="思考レシート表示">📜 監査票</button>
      <a class="icon-btn" id="btn-fullscreen-out" href="http://localhost:8080/mindmap_interactive_studio.html" target="_blank" title="全画面シアターで開く">↗️</a>
    </div>
  </div>

  <!-- 🗣️ Live Query Bar (Captures gemini.google.com input) -->
  <div class="live-query-banner">
    <div class="query-label">
      <span>本家 Gemini での質問</span>
      <span style="color:#10b981;" id="sync-clock">LIVE</span>
    </div>
    <div class="query-text" id="live-query-text">
      ドローンがなぜ東に救助者がいるのに北に直進するのか調べて修正して
    </div>
  </div>

  <!-- 🎨 Canvas Area (Scalable) -->
  <div class="canvas-container" id="canvas-container">
    <canvas id="sidepanel-canvas"></canvas>

    <div class="zoom-controls">
      <button class="zoom-btn" onclick="window.sideEngine.zoomIn()" title="拡大">➕</button>
      <button class="zoom-btn" onclick="window.sideEngine.zoomOut()" title="縮小">➖</button>
      <button class="zoom-btn" onclick="window.sideEngine.resetView()" title="中心復帰">🎯</button>
    </div>

    <!-- Inspector Drawer -->
    <div class="inspector-drawer" id="inspector-drawer">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span id="insp-category-badge" style="font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; background:#10b981; color:#07090e;">🌐 GOOGLE SEARCH GROUNDING</span>
        <button style="background:none; border:none; color:#94a3b8; font-size:14px; cursor:pointer;" onclick="window.sideEngine.selectNode(null)">✕</button>
      </div>
      <div id="insp-header-title" style="font-size:12px; font-weight:700; color:#fff;">Threejs_Euler_Yaw_Specification</div>
      <div id="insp-details-content" style="font-size:11px; color:#cbd5e1; line-height:1.5;"></div>
    </div>
  </div>

  <!-- 🎛️ Drag Resizer Splitter (上下可変バー) -->
  <div class="panel-splitter" id="panel-splitter" title="上下ドラッグでアニメとログの比率を調整">
    <div class="splitter-handle"></div>
  </div>

  <!-- 📜 Bottom Thinking Chronicle (可変高さ＆Googleドキュメント保存) -->
  <div class="chronicle-container" id="chronicle-container">
    <div class="chronicle-header">
      <div class="chronicle-title">
        <span>📜 思考実況タイムライン</span>
      </div>
      <div class="chronicle-actions">
        <button class="preset-btn" onclick="setPanelPreset('anime')" title="アニメ大">📊 30%</button>
        <button class="preset-btn" onclick="setPanelPreset('half')" title="均等">⚖️ 50%</button>
        <button class="preset-btn" onclick="setPanelPreset('log')" title="ログ大">📜 75%</button>
        <button class="gdocs-btn" onclick="exportToGoogleDocs()" title="思考ログとエビデンスをGoogleドキュメントに保存">
          <span>📄 Google Docs 保存</span>
        </button>
      </div>
    </div>
    <div class="chronicle-stream" id="side-chronicle">
      <div class="log-row">
        <span class="time">[T+000ms]</span>
        <span class="txt" style="color:#64748b;">Gemini Live Synchronizer Standby. 本家Geminiの入力を監視中...</span>
      </div>
    </div>
  </div>

  <!-- 📜 Receipt Modal -->
  <div class="receipt-backdrop" id="receipt-modal">
    <div class="receipt-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <span style="font-weight:700; color:#00f0ff;">=== GENESIS μTRON AUDIT TRAIL ===</span>
        <button style="background:none; border:none; color:#fff; font-size:16px; cursor:pointer;" onclick="closeReceiptModal()">✕</button>
      </div>
      <div id="receipt-content-area"></div>
      <div style="margin-top:14px; text-align:right;">
        <button class="gdocs-btn" style="display:inline-flex;" onclick="exportToGoogleDocs()">
          <span>📄 この監査票をGoogleドキュメントに保存</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 🔔 Toast -->
  <div class="toast-notice" id="toast-notice">
    <span>✅ Googleドキュメント形式でコピーしました！Docsを開きます...</span>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
